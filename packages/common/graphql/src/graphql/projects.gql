# PROJECTS
query projects($workspaceId: String!, $skip: Float, $take: Float, $query: String, $status: String, $visibility: String) {
  projects(workspaceId: $workspaceId, skip: $skip, take: $take, query: $query, status: $status, visibility: $visibility) {
    id
    workspaceId
    name
    description
    icon
    banner
    color
    category
    status
    visibility
    createdAt
    updatedAt
    restrictedMembers {
      projectId
      userId
      user {
        id
        name
        email
        avatarUrl
      }
    }
  }
}

query project($workspaceId: String!, $id: String!) {
  project(workspaceId: $workspaceId, id: $id) {
    id
    workspaceId
    name
    description
    icon
    banner
    color
    category
    status
    visibility
    createdAt
    updatedAt
    restrictedMembers {
      projectId
      userId
      user {
        id
        name
        email
        avatarUrl
      }
    }
  }
}

mutation createProject($workspaceId: String!, $input: CreateProjectInput!) {
  createProject(workspaceId: $workspaceId, input: $input) {
    id
    workspaceId
    name
    description
    icon
    banner
    color
    category
    status
    visibility
    createdAt
    updatedAt
  }
}

mutation updateProject($workspaceId: String!, $id: String!, $input: UpdateProjectInput!) {
  updateProject(workspaceId: $workspaceId, id: $id, input: $input) {
    id
    workspaceId
    name
    description
    icon
    banner
    color
    category
    status
    visibility
  }
}

mutation deleteProject($workspaceId: String!, $id: String!) {
  deleteProject(workspaceId: $workspaceId, id: $id)
}

query projectAnalytics($workspaceId: String!, $projectId: String!) {
  projectAnalytics(workspaceId: $workspaceId, projectId: $projectId) {
    totalIssues
    completedTasks
    openBugs
    currentSprintName
