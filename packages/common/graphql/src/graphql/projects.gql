# GEMINI SETTINGS
query workspaceGeminiSetting($workspaceId: String!) {
  workspaceGeminiSetting(workspaceId: $workspaceId) {
    workspaceId
    apiKey
    model
    meetingModel
    allowGemini
    limitOutput
    sshHost
    sshUser
    sshPass
    allowWithoutPermission
    lockContentFor
  }
}

mutation updateWorkspaceGeminiSetting(
  $workspaceId: String!
  $apiKey: String
  $model: String
  $meetingModel: String
  $allowGemini: Boolean
  $limitOutput: Boolean
  $sshHost: String
  $sshUser: String
  $sshPass: String
  $allowWithoutPermission: Boolean
  $lockContentFor: JSON
) {
  updateWorkspaceGeminiSetting(
    workspaceId: $workspaceId
    apiKey: $apiKey
    model: $model
    meetingModel: $meetingModel
    allowGemini: $allowGemini
    limitOutput: $limitOutput
    sshHost: $sshHost
    sshUser: $sshUser
    sshPass: $sshPass
    allowWithoutPermission: $allowWithoutPermission
    lockContentFor: $lockContentFor
  ) {
    workspaceId
    apiKey
    model
    meetingModel
    allowGemini
    limitOutput
    sshHost
    sshUser
    sshPass
    allowWithoutPermission
    lockContentFor
  }
}

