# ISSUES
query projectIssues($workspaceId: String!, $filter: ProjectIssuesFilterInput) {
  projectIssues(workspaceId: $workspaceId, filter: $filter) {
    id
    workspaceId
    projectId
    title
    description
    type
    priority
    status
    dueDate
    estimatedTime
    timeSpent
    reporterId
    reporter {
      id
      name
      email
      avatarUrl
    }
    cycleId
    cycle {
      id
      name
      status
    }
    moduleId
    module {
      id
      name
    }
    releaseId
    release {
      id
      name
      status
    }
    parentIssueId
    parentIssue {
      id
      title
    }
    subtasks {
      id
      title
      status
    }
    assignees {
      issueId
      userId
      user {
        id
        name
        email
        avatarUrl
      }
    }
    labels {
      label {
        id
        name
        color
      }
    }
    blockedIssues {
      blockerIssue {
        id
        title
        status
      }
    }
    blockerIssues {
      blockedIssue {
        id
        title
        status
      }
    }
  }
}

