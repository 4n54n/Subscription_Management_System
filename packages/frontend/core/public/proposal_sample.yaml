risks_intro: "To guarantee delivery of the Autonomous AI Agent Platform, IntoAI proactively logs operational and technical risks alongside active mitigations."
risks:
  - id: "Risk 01"
    title: "Legacy API Schema Changes"
    impact: "Upstream modifications in JIRA or Git webhook payloads could break semantic graph mappings and interrupt agent schedulers."
    mitigation: "IntoAI deploys a decoupled Ingestion Queue gateway with automated schema-drift alerts, buffering raw payloads for replay once parsed."
  - id: "Risk 02"
    title: "LLM Context Token Window Exhaustion"
    impact: "Fragmented project history containing long ticket updates could exceed the LLM's context limit, causing loss of critical task requirements."
    mitigation: "IntoAI compiles a structured context map summarizing historical sprints and filters out redundant stack traces prior to agent execution."

steering_governance: "A joint steering committee (composed of Example Company Sponsor Sarah Jenkins, Marcus Chen, and IntoAI Systems MD Ansan Mathew) will review milestone velocity bi-weekly. Any architectural deviation or telemetry schema discrepancies will be logged in the project risk register, with impact reviews completed within 48 hours to preserve the 20-week timeline."

support_intro: "Post-deployment stability is covered by structured support agreements and response targets."
support:
  warranty_period: "IntoAI provides a 90-day warranty starting on the date of production handover. This covers critical bug fixes, patch deployments, and data graph ontology corrections at no additional charge."
  extended_maintenance_desc: "For ongoing operations, IntoAI offers an Extended Support SLA tier for $4,500/month, including 24/7 critical incident response, monthly database tuning, and up to 15 hours of minor modifications."
  improvement_cycle_desc: "At the close of each support quarter, IntoAI provides a comprehensive Graph Telemetry Analysis Report. This report audits algorithm performance metrics (e.g. task decomposition latency, solver convergence rates, and manager assignment overrides) and suggests optimization tweaks, ensuring the scheduling core remains tuned to team velocity trends."
  sla_tiers:
    - severity: "P1 · Critical"
      description: "Production system down, or core scheduling operations entirely blocked. No workaround exists."
      response_time: "< 2 Hours"
    - severity: "P2 · Urgent"
      description: "Core agent planning or dashboard interface severely impaired. Workaround is complex."
      response_time: "< 4 Hours"
    - severity: "P3 · Standard"
      description: "Non-critical system feature impairment or minor software bug. Workaround is available."
      response_time: "< 1 Business Day"
    - severity: "P4 · Minor"
      description: "Cosmetic issues, documentation updates, or minor feature enhancement requests."
      response_time: "< 2 Business Days"

